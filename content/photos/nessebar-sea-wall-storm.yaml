slug: nessebar-sea-wall-storm
title: "Nessebar Sea Wall in a Storm"
caption: "Waves breaking over the sea wall during a storm, an archival black-and-white image."
description: >-
  Waves break over the sea wall during a storm, an archival black-and-white image of Nessebar's exposed coast. White water crashes against the stone as the wind drives the surf higher, and the sky is a single grey sheet above the water.
alt: "Waves breaking over Nessebar's sea wall in a storm."
translations:
  bg:
    title: "Морската стена на Несебър по време на буря"
    caption: "Вълни се разбиват над морската стена по време на буря в архивна черно-бяла снимка."
    description: >-
      Вълни се разбиват над морската стена по време на буря в тази архивна черно-бяла снимка на открития несебърски бряг. Бялата пяна се стоварва върху камъните, докато вятърът издига прибоя все по-високо, а над водата небето е покрито с плътен сив облачен слой.
    alt: "Вълни се разбиват над морската стена на Несебър по време на буря."

slug: nessebar-sea-wall-storm
title: "Nessebar Sea Wall in a Storm"
caption: "Waves breaking over the sea wall during a storm, an archival black-and-white image."
description: >-
  Waves break over the sea wall during a storm, an archival black-and-white image of Nessebar's exposed coast. White water crashes against the stone as the wind drives the surf higher, and the sky is a single grey sheet above the water.
alt: "Waves breaking over Nessebar's sea wall in a storm."

slug: fishing-boats-at-dawn-nessebar
title: "Fishing Boats at Dawn"
caption: "Small wooden boats pulled up on the pebble beach before the morning fleet sails."
description: >-
  Small wooden boats lie pulled up on the pebble beach, nets coiled in their bows, waiting for the morning fleet to sail. The harbour is quiet, the water still, and the first light colours the masts pale gold.
alt: "Small wooden fishing boats pulled up on a pebble beach at dawn."
translations:
  bg:
    title: "Рибарски лодки на разсъмване"
    caption: "Малки дървени лодки, изтеглени на чакълестия плаж преди отплаването на сутрешния рибарски флот."
    description: >-
      Малки дървени лодки са изтеглени на чакълестия плаж, а мрежите са навити в носовете им в очакване на отплаването на сутрешния рибарски флот. Пристанището е тихо, водата е неподвижна, а първите слънчеви лъчи обагрят мачтите в бледозлатисто.
    alt: "Малки дървени рибарски лодки, изтеглени на чакълест плаж на разсъмване."

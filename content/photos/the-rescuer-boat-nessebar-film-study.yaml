slug: the-rescuer-boat-nessebar-film-study
title: The Rescuer Boat, Nessebar Film Study
caption: Спасител rests on blocks beneath the trees beside Nessebar’s rugged coast.
description: >-
  A striking analog monochrome composition featuring a dry-docked rescue boat
  ("Спасител" / "Rescuer", HC 180) resting beneath gnarled trees and a rugged
  rock formation in Nessebar, Bulgaria. Shot on 35mm Kentmere Pan 100 film with
  a Nikon F3, this
  photograph highlights the weathered textures of coastal life and maritime
  heritage along the Black Sea, recorded purely through mechanical optics
  without digital enhancement.
alt: Black-and-white photograph of the rescue boat Спасител, marked HC 180,
  resting on blocks beneath bare trees beside a rocky outcrop.

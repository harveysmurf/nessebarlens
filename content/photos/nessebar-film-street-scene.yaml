slug: nessebar-film-street-scene
title: "Nessebar Street Scene"
caption: "A street scene in Nessebar on film, grainy and candid."
description: >-
  A grainy film street scene in Nessebar: a cobbled lane, a shuttered shop, and a cat sitting in a doorway. The film stock gives the image a soft contrast and a faint silver cast, the way old photographs age.

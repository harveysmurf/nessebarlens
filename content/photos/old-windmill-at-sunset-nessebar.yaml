slug: old-windmill-at-sunset-nessebar
title: "Old Windmill at Sunset"
caption: "The eighteenth-century windmill on Nessebar's ridge, lit by the last light of the day."
description: >-
  A solitary stone windmill stands on the ridge above the old town, its sails still, as the sun drops behind the Black Sea coast. The warm light picks out the ochre stonework and the long shadow it casts across the plateau.
alt: "An old stone windmill on a ridge against a sunset sky over the Black Sea."
translations:
  bg:
    title: "Стара вятърна мелница по залез"
    caption: "Вятърната мелница от XVIII век на билото на Несебър, озарена от последните слънчеви лъчи за деня."
    description: >-
      Самотна каменна вятърна мелница се издига на билото над стария град, а крилата ѝ са неподвижни, докато слънцето залязва зад черноморския бряг. Топлата светлина подчертава охрените камъни и дългата сянка, която мелницата хвърля върху платото.
    alt: "Стара каменна вятърна мелница на билото на фона на залеза над Черно море."
category: fine-art

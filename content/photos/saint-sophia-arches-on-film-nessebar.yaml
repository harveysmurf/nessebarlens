slug: saint-sophia-arches-on-film-nessebar
title: Saint Sophia Arches on Film, Nessebar
caption: Kentmere Pan 100 captures Saint Sophia’s arches in stark light and grain.
description: An analog night study of the historic Church of Saint Sophia ruins
  in Old Town Nessebar, Bulgaria. Shot on Kentmere Pan 100 black-and-white film,
  artificial night lighting outlines the rugged brick arches with striking grain
  and deep, high-contrast shadows. This piece merges traditional chemical
  photography with the enduring architecture of a UNESCO World Heritage site,
  captured entirely by hand without digital manipulation.
alt: Grainy black-and-white photograph of the illuminated brick arches of the
  Church of Saint Sophia at night in Nessebar.

slug: saint-sophia-arches-on-film-nessebar
title: Saint Sophia Arches on Film, Nessebar
caption: Kentmere Pan 100 captures Saint Sophia’s arches in stark light and grain.
description: An analog night study of the historic Church of Saint Sophia ruins
  in Old Town Nessebar, Bulgaria. Shot on 35mm Kentmere Pan 100 black-and-white
  film with a Nikon F3. Artificial night lighting outlines the rugged brick arches
  with striking grain
  and deep, high-contrast shadows. This piece merges traditional chemical
  photography with the enduring architecture of a UNESCO World Heritage site,
  captured entirely by hand without digital manipulation.
alt: Grainy black-and-white photograph of the illuminated brick arches of the
  Church of Saint Sophia at night in Nessebar.
translations:
  bg:
    title: Арките на „Света София“ на филм, Несебър
    caption: Kentmere Pan 100 улавя арките на „Света София“ в контрастна светлина и
      зърно.
    description: Аналогова нощна композиция на руините на историческата църква „Света София“
      в Стария Несебър, България. Сниман на 35 мм черно-бял филм Kentmere Pan 100
      с Nikon F3. Изкуственото нощно осветление очертава грубите тухлени арки с
      поразително зърно и дълбоки, висококонтрастни сенки. Творбата съчетава
      традиционната химическа фотография с вечната архитектура на обект с
      изключителна световна стойност, заснета изцяло на ръка, без цифрова
      обработка.
    alt: Зърнеста черно-бяла снимка на осветените тухлени арки на църквата „Света
      София“ нощем в Несебър.

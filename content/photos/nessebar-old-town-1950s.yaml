slug: nessebar-old-town-1950s
title: "Nessebar Old Town, 1950s"
caption: "An archival black-and-white view of the old town's cobbled lanes and wood-and-stone houses."
description: >-
  An archival black-and-white photograph of Nessebar's old town in the 1950s: cobbled lanes climb the hill between wood-and-stone houses with overhanging eaves, and washing hangs on lines between the buildings. A few figures move in the distance near the church square.
alt: "Cobbled lanes and wood-and-stone houses in Nessebar's old town, 1950s."
translations:
  bg:
    title: "Старият град на Несебър през 50-те години"
    caption: "Архивен черно-бял изглед към калдъръмените улички и къщите от дърво и камък в стария град."
    description: >-
      Архивна черно-бяла снимка на стария град на Несебър през 50-те години на XX век: калдъръмени улички се изкачват по хълма между къщи от дърво и камък с надвиснали стрехи, а между сградите са опънати въжета с пране. В далечината се виждат няколко фигури близо до площада пред църквата.
    alt: "Калдъръмени улички и къщи от дърво и камък в стария град на Несебър през 50-те години."

slug: nessebar-fortress-wall
title: "Nessebar Fortress Wall"
caption: "The remains of the medieval fortress wall along the peninsula's narrow isthmus."
description: >-
  The remains of the medieval fortress wall stand along the narrow isthmus that joins the Nessebar peninsula to the mainland. Weathered stone blocks and the arched gateway are shown without colour, the sea visible beyond the wall on both sides.
alt: "Remains of the medieval fortress wall on the Nessebar isthmus."
translations:
  bg:
    title: "Крепостната стена на Несебър"
    caption: "Останки от средновековната крепостна стена по тесния провлак на полуострова."
    description: >-
      Останките от средновековната крепостна стена се издигат по тесния провлак, който свързва Несебърския полуостров със сушата. Изветрелите каменни блокове и сводестият вход са показани в черно-бял кадър, а отвъд стената от двете страни се вижда морето.
    alt: "Останки от средновековната крепостна стена на Несебърския провлак."

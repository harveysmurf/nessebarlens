    title: "Крепостната стена на Nessebar"
    caption: "Останите на средновековната крепостена стена стоя lungo принудратна ултана."
    description: >-
      Останите на средновековната крепостена стена стои entlang الجس на któryєт полуострова Nessebar с клипата. Обветшали кравъни блокове и скритото портал са показани без цвят.
    alt: "Остатки на средновековната крепостна стена на истмуса на Nessebar."

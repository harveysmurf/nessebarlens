slug: nessebar-harbour-in-black-and-white-bulgaria
title: Nessebar Harbour in Black and White, Bulgaria
caption: Seagulls circle above the fishing boats in Nessebar’s historic harbour.
description: A black and white photograph of seagulls above the calm harbour
  waters and fishing boats of Old Town Nessebar, Bulgaria. Shot on 35mm Kentmere
  Pan 100 film with a Nikon F3, the image brings together the harbour’s weathered boats,
  ancient coastal ruins, and the quiet atmosphere of this UNESCO World Heritage
  town.
alt: Seagulls flying above fishing boats on the calm waters of Old Town
  Nessebar’s historic harbour in Bulgaria.
translations:
  bg:
    title: Пристанището в Несебър на черно и бяло, България
    caption: Чайки кръжат над риболовните лодки в историческото пристанище на Несебър.
    description: Черно-бяла снимка на чайки над спокойните води на пристанището и риболовните
      лодки в Стария Несебър, България. Сниман на 35 мм филм Kentmere Pan 100 с
      Nikon F3, кадърът обединява износените от времето лодки на пристанището,
      древните крайбрежни руини и тихата атмосфера на този град — обект с
      изключителна световна стойност.
    alt: Чайки летят над риболовните лодки в спокойните води на историческото
      пристанище в Стария Несебър, България.

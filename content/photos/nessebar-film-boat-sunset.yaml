slug: nessebar-film-boat-sunset
title: "Nessebar Boat at Sunset"
caption: "A small boat at sunset on film, sepia-toned and quiet."
description: >-
  A small boat drifts at sunset on film, sepia-toned and quiet. The fading light reddens the water, the boat rides low, and the horizon is a thin line between sea and sky. The grain holds the moment soft.
alt: "A small boat at sunset on film in Nessebar."
translations:
  bg:
    title: "Лодка в Несебър по залез"
    caption: "Малка лодка по залез, заснета на филм в сепийни тонове — тиха и спокойна сцена."
    description: >-
      Малка лодка се носи по водата по заlez в кадър, заснет на филм в сепийни тонове. Залязващата светлина обагря водата в червеникави нюанси, лодката се носи ниско над водата, а хоризонтът е тънка линия между морето и небето. Зърнистостта на филма придава на момента мекота.
    alt: "Малка лодка по заlez, заснета на филм в Несебър."

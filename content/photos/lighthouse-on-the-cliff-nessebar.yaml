slug: lighthouse-on-the-cliff-nessebar
title: "Lighthouse on the Cliff"
caption: "The lighthouse keeper's cottage and tower perched above the rocky coast."
description: >-
  The lighthouse and its keeper's cottage sit on the cliff edge above the rocks, the beam sweeping out over the shipping lane each evening. Sea pink grows in the cracks of the stonework, and the wind carries salt from the open water.
alt: "A lighthouse and cottage perched on a cliff above the rocky coast."
translations:
  bg:
    title: "Фар на скалистия бряг"
    caption: "Къщата на пазача и кулата на фара, разположени над скалистия бряг."
    description: >-
      Фарът и къщата на неговия пазач са разположени на ръба на скалите над морския бряг, а всяка вечер светлинният лъч се плъзга над корабния маршрут. Морски карамфил расте в пукнатините на каменната зидария, а вятърът носи соления дъх на откритото море.
    alt: "Фар и къща на пазача, разположени на скала над скалистия морски бряг."

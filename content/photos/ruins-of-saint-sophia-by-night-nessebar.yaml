slug: ruins-of-saint-sophia-by-night-nessebar
title: Ruins of Saint Sophia by Night, Nessebar
caption: Artificial light reveals the weathered arches of Saint Sophia after dark.
description: A dramatic, high-contrast monochrome study of the 5th-century
  Church of Saint Sophia ruins in Old Town Nessebar, Bulgaria. Shot at night,
  artificial illumination carves stark geometric light through ancient stone
  arches and weathered brickwork, creating a hauntingly timeless atmosphere.
  This authentic fine art photograph captures the profound historical weight of
  a UNESCO World Heritage site under the cover of darkness, recorded purely
  through the camera lens with zero artificial intelligence generation.
alt: Black-and-white night photograph of the illuminated stone arches and
  central apse of the Church of Saint Sophia ruins in Nessebar.
category: fine-art

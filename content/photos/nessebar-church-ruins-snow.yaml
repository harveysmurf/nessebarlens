slug: nessebar-church-ruins-snow
title: "Nessebar Church Ruins in Snow"
caption: "The ruins of an old church covered in snow, an archival winter photograph."
description: >-
  The ruins of an old church stand covered in snow, an archival winter photograph. The stone arches rise blank against the grey sky, snow fills the nave, and the cross above the gable stands bare against the light.
alt: "Old church ruins covered in snow in Nessebar."
translations:
  bg:
    title: "Руини на несебърска църква под снега"
    caption: "Руини на стара църква, покрити със сняг, в архивна зимна фотография."
    description: >-
      Руините на стара църква са покрити със сняг в тази архивна зимна фотография. Каменните арки се открояват на фона на сивото небе, снегът покрива вътрешността на църквата, а кръстът над фронтона се извисява самотно на светлия фон.
    alt: "Руини на стара църква, покрити със сняг в Несебър."

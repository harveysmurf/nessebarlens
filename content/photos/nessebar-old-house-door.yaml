title: "The Old House Door"
caption: "A weathered wooden door of an old Nessebar house, an archival detail shot."
description: >-
  A weathered wooden door of an old Nessebar house, an archival detail shot. The peeling paint and iron latch speak of decades, with a worn stone step and a shadowed passage behind the door.
alt: "A weathered wooden door of an old Nessebar house."

slug: stone-wall-and-sea-nessebar
title: "Stone Wall and the Sea"
caption: "The ancient fortress wall running down to the water, with the breakwater beyond."
description: >-
  The old stone wall follows the coastline toward the breakwater, worn smooth by centuries of sea wind. Gulls rest on the coping stones where the wall meets the surf, and the water is dark and calm beneath an overcast sky.
alt: "An ancient stone wall running down to the sea with a breakwater beyond."
translations:
  bg:
    title: "Каменна стена и море"
    caption: "Древната крепостна стена, спускаща се към водата, с вълнолома отвъд нея."
    description: >-
      Старата каменна стена следва бреговата линия към вълнолома, загладена от векове морски ветрове. Чайки почиват върху горните камъни на стената там, където тя достига прибоя, а водата е тъмна и спокойна под облачното небе.
    alt: "Древна каменна стена, спускаща се към морето, с вълнолом отвъд нея."

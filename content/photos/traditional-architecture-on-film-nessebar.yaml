slug: traditional-architecture-on-film-nessebar
title: Traditional Architecture on Film, Nessebar
caption: A traditional timber house in Old Town Nessebar, photographed on
  Kentmere Pan 100.
description: >-
  A classic architectural study of a traditional Black Sea wooden house in Old
  Town Nessebar, Bulgaria. Shot on 35mm Kentmere Pan 100 black-and-white film
  with a Nikon F3. The rich grain emphasizes the horizontal wood planks,
  overhanging roof structure, and distinctive regional heritage of this UNESCO World Heritage
  location through authentic analog capture.
alt: Black-and-white photograph of a traditional timber house in Old Town
  Nessebar, with horizontal plank siding, an overhanging tiled roof, and small
  conifers in front.
translations:
  bg:
    title: Традиционна архитектура на филм, Несебър
    caption: Традиционна дървена къща в Стария Несебър, снимка на Kentmere Pan 100.
    description: Класическо архитектурно изследване на традиционна дървена къща от
      Черноморието в Стария Несебър, България. Сниман на 35 мм черно-бял филм
      Kentmere Pan 100 с Nikon F3. Богатото зърно подчертава хоризонталните дъски,
      изнесената покривна конструкция и характерното местно наследство на този
      обект с изключителна световна стойност чрез автентичен аналогов запис.
    alt: Черно-бяла снимка на традиционна дървена къща в Стария Несебър, с
      хоризонтална дъсчена облицовка, изнесен керемиден покрив и малки кедри пред
      нея.

slug: golden-sun-flare-shining-through-stone-arch-ruins-of-saint-sophia-church-in-nessebar-bulgaria
title: Golden sun flare shining through stone arch ruins of Saint Sophia Church
caption: Sunlight breaks through the stone arches of Saint Sophia in Old Town Nessebar.
description: Sunburst shining through an arched window opening of the ancient
  Church of Saint Sophia (Old Bishopric) ruins in Old Town Nessebar, Bulgaria.
  The sun creates a warm starburst flare over stone brick arches and historic
  wall masonry under a soft blue sky.
alt: Sunburst shining through an arched window opening of the ancient Church of
  Saint Sophia (Old Bishopric) ruins in Old Town Nessebar, Bulgaria.
translations:
  bg:
    title: Златен слънчев отблясък през каменните арки на църквата „Света София“
    caption: Слънцето пробива през каменните арки на „Света София“ в Стария Несебър.
    description: Слънчеви лъчи, проникващи през арочното прозоречно отверстие на руините на
      древната църква „Света София“ (Старото епископство) в Стария Несебър,
      България. Слънцето създава топъл звездовиден отблясък над каменните тухлени
      арки и историческата зидария под меко синьо небе.
    alt: Слънчеви лъчи, проникващи през арочното прозоречно отверстие на руините на
      древната църква „Света София“ (Старото епископство) в Стария Несебър,
      България.

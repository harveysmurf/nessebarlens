slug: nessebar-fishermen-wharf
title: "Nessebar Fishermen's Wharf"
caption: "Fishermen mending nets on the old wharf, an archival black-and-white scene."
description: >-
  Fishermen mend their nets on the old wharf, an archival black-and-white scene from the working harbour. Wooden bollards, coiled rope, and the hulls of small boats crowd the quay, while the sea laps quietly beyond the breakwater.
alt: "Fishermen mending nets on the old wharf in Nessebar."

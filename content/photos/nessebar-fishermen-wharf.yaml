    description: >-
      Рибари поправят мрежи на стария причал, архивна сцена от работения порта. Дървени столби, намотани мрежи и тюлове на малите лодки на кия, докато морето язи тихо от буера.
    alt: "Рибари поправят мрежи на стар причал в Несебар."

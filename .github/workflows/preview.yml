name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# The default for the one job here that needs nothing: read the repository,
# write nothing. The default in-repo token is write-all, which is more than
# any job in this workflow asked for except one.
#
# `deploy` is that exception — its last step comments the preview URL on the
# pull request, so it raises `pull-requests: write` on the job below. That
# override is load-bearing: drop it and the comment step stops working with no
# other signal.
permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
    steps:
      # The checkout is for the repository, not for the local action: `$/`
      # loads .github/actions/setup from the running commit, so it does not
      # depend on the workspace being populated first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `github.head_ref` is attacker-controlled text: it comes from the PR
      # author's branch name, so interpolating it into `run:` hands the shell
      # the branch name as source. Pass it through `env:` and let bash quote
      # it — the sanitizer then narrows it to [a-z0-9-], which is what makes
      # the step output safe to interpolate in the steps below.
      - name: Sanitize branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(bash scripts/sanitize-branch-name.sh "$HEAD_REF")" >> "$GITHUB_OUTPUT"

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      # Secrets ride along on the version upload itself (--secrets-file), which
      # is what makes a preview safe on a worker that also serves production.
      # The previous shape -- sync secrets, then deploy -- only worked on Pages
      # because Pages had separate preview and production env maps. A Worker has
      # one secret store per deployed version, so a separate `secret bulk` here
      # would write the sandbox Stripe key over the live one and take the
      # production site down until the next deploy. Attaching the secrets to the
      # version being uploaded never touches what is serving.
      - name: Upload preview version
        id: deploy
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODIGI_WEBHOOK_TOKEN: ${{ secrets.PRODIGI_WEBHOOK_TOKEN }}
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          # Explicit host — never inferred from which Prodigi key is set.
          PRODIGI_API_BASE: https://api.sandbox.prodigi.com
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # The script is invoked in file-only mode: it runs every #114 guard and
          # writes the JSON, but does not call wrangler itself. The upload below
          # is what applies it. Running it in apply mode first would write to the
          # deployed worker's secrets, which is the thing to avoid here.
          SYNC_SCOPE=version-only SECRETS_OUT=preview-secrets.json \
            bash scripts/sync-worker-secrets.sh preview

          # No `#` anywhere in these arguments, and that is deliberate.
          # opennextjs-cloudflare re-spawns wrangler with `shell: true`
          # (run-wrangler.js) and applies its quoteShellMeta() helper only to the
          # deployment-mapping var, never to passthrough args. So the string is
          # re-parsed by a shell that never sees our quoting, and a `#` starts a
          # comment there: `--message="preview PR #172"` reached wrangler as
          # `--message=preview` plus a bare `PR`, which it took as the
          # entry-point path -- `The entry-point file at "PR" was not found`.
          # Quoting harder in this step cannot fix it; the character is the
          # problem. Keep both values free of shell metacharacters.
          #
          # No --commit-hash/--commit-dirty here: those are Pages deploy flags and
          # `versions upload` rejects them outright ("Unknown arguments:
          # commit-dirty, commit-hash"). --tag and --message are the version
          # identity on Workers, and the head sha is recorded in the message so
          # a version can still be traced to its commit.
          # Output is teed so the version id and preview URL can be read back
          # below; the upload still streams to the log either way.
          npx opennextjs-cloudflare upload \
            --secrets-file=preview-secrets.json \
            --tag="pr-$PR_NUMBER-$BRANCH" \
            --message="preview-PR-$PR_NUMBER-$HEAD_SHA" 2>&1 | tee upload.log

          # A version has no branch alias, so the smoke test and the PR comment
          # address it by id. The id is read from wrangler's own output line
          # rather than from `versions list`, for two measured reasons:
          #
          #  * the tag is stored in `annotations["workers/tag"]`, not a `tags`
          #    array, so a reader looking for `tags` finds nothing and the step
          #    fails with "no version tagged" after a perfectly good upload --
          #    which is what CI did; and
          #  * the subdomain is already known to wrangler, which prints the
          #    preview URL itself. Rebuilding that URL by hand from a repo
          #    variable duplicates a format wrangler owns -- it uses the FIRST 8
          #    characters of the version id, not the whole one.
          #
          # So take both from the upload output, and fail loudly if either is
          # absent rather than smoke-testing an empty URL.
          upload_out="$(cat upload.log)"
          echo "$upload_out"
          vid="$(printf '%s' "$upload_out" | sed -n 's/^Worker Version ID: //p' | head -n 1)"
          url="$(printf '%s' "$upload_out" | sed -n 's/^Version Preview URL: //p' | head -n 1)"
          if [[ -z "$vid" || -z "$url" ]]; then
            echo "::error::upload did not report a version id / preview URL; cannot smoke this build"
            exit 1
          fi
          echo "version_id=$vid" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          rm -f preview-secrets.json

      - name: Smoke test the deployed preview
        id: smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          # tee is last in the pipe, so capture the status explicitly rather
          # than trusting the pipeline result.
          bash scripts/smoke.sh "$SMOKE_URL" | tee smoke.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -eq 0 ]]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::error::Preview smoke test failed against $SMOKE_URL"
            exit 1
          fi

      - name: Comment preview URL
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const version = '${{ steps.deploy.outputs.version_id }}';
            const smoke = '${{ steps.smoke.outputs.result }}' || 'skipped';
            const badge = smoke === 'pass'
              ? '\u2705 smoke passed'
              : smoke === 'fail' ? '\u274c smoke failed' : '\u23ed\ufe0f smoke not run';
            const body = [
              '### Staging preview',
              '',
              `- Version: \`${version}\``,
              `- URL: ${url}`,
              `- Built with staging secrets (sandbox Stripe/Prodigi).`,
              `- Smoke: ${badge}`,
              '',
              'A Workers version has no branch alias, so this URL is per-version',
              'and stops resolving once the version is deleted on PR close.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Staging preview';
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The checkout is for the repository, not for the local action: `$/`
      # loads .github/actions/setup from the running commit, so it does not
      # depend on the workspace being populated first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install-args: --ignore-scripts

      # `github.head_ref` is attacker-controlled text: it comes from the PR
      # author's branch name, so interpolating it into `run:` hands the shell
      # the branch name as source. Pass it through `env:` and let bash quote
      # it — the sanitizer then narrows it to [a-z0-9-], which is what makes
      # the step output safe to interpolate in the steps below.
      - name: Sanitize branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(bash scripts/sanitize-branch-name.sh "$HEAD_REF")" >> "$GITHUB_OUTPUT"

      - name: Delete preview versions
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          echo "Cleaning versions tagged for branch=$BRANCH"
          npx wrangler versions list --json > versions.json
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          branch = os.environ["BRANCH"]
          try:
              vs = json.load(open("versions.json"))
          except Exception as e:
              # Cleanup is best-effort by nature: a PR that closed while the
              # account was unreachable should close, not wedge on a leftover
              # version. Versions are also inert once undeployed, so a stale one
              # costs quota, not correctness.
              print("could not list versions:", e)
              sys.exit(0)
          if isinstance(vs, dict):
              vs = vs.get("versions") or vs.get("result") or []

          deleted = 0
          for v in vs:
              # The tag --tag set at upload lives in annotations["workers/tag"],
              # NOT in a `tags` array. The deploy step was reading `tags` and
              # therefore matched nothing; this reads where wrangler actually
              # puts it, and falls back to `tags` so a future wrangler that
              # populates it is not silently ignored.
              ann = v.get("annotations") or {}
              tag = ann.get("workers/tag")
              names = []
              if tag:
                  names.append(tag)
              for t in v.get("tags") or []:
                  names.append(t.get("name") if isinstance(t, dict) else t)
              vid = v.get("id")
              if not vid or not any(n and n.endswith("-" + branch) for n in names):
                  continue
              print("delete", vid, names)
              subprocess.run(
                  ["npx", "wrangler", "versions", "delete", vid, "--force"],
                  check=False,
              )
              deleted += 1
          print(f"deleted={deleted}")
          PYEOF

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Sanitize branch name
        id: branch
        run: |
          raw="${{ github.head_ref }}"
          # Pages branch names: lowercase, alphanumeric + hyphen
          safe="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g' | cut -c1-58)"
          echo "name=$safe" >> "$GITHUB_OUTPUT"

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Assemble Pages bundle
        run: bash scripts/assemble-pages-out.sh

      - name: Deploy Pages preview
        id: deploy
        run: |
          set -euo pipefail
          OUT=$(npx wrangler pages deploy .pages-out \
            --project-name=nessebar-lens \
            --branch="${{ steps.branch.outputs.name }}" \
            --commit-dirty=true \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-message="preview PR #${{ github.event.pull_request.number }}")
          echo "$OUT"
          url="$(echo "$OUT" | grep -Eo 'https://[a-z0-9.-]+\.nessebar-lens\.pages\.dev' | tail -1)"
          alias="https://${{ steps.branch.outputs.name }}.nessebar-lens.pages.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Sync Pages preview runtime secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}
          # Explicit host — never inferred from which Prodigi key is set.
          PRODIGI_API_BASE: https://api.sandbox.prodigi.com
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/sync-pages-secrets.sh preview

      - name: Smoke test the deployed preview
        id: smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.alias }}
        run: |
          set -uo pipefail
          # tee is last in the pipe, so capture the status explicitly rather
          # than trusting the pipeline result.
          bash scripts/smoke.sh "$SMOKE_URL" | tee smoke.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -eq 0 ]]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::error::Preview smoke test failed against $SMOKE_URL"
            exit 1
          fi

      - name: Comment preview URL
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const alias = '${{ steps.deploy.outputs.alias }}';
            const url = '${{ steps.deploy.outputs.url }}';
            const smoke = '${{ steps.smoke.outputs.result }}' || 'skipped';
            const badge = smoke === 'pass'
              ? '✅ smoke passed'
              : smoke === 'fail' ? '❌ smoke failed' : '⏭️ smoke not run';
            const body = [
              '### Staging preview',
              '',
              `- Alias: ${alias}`,
              `- Deployment: ${url}`,
              `- Built with staging secrets (sandbox Stripe/Prodigi).`,
              `- Smoke: ${badge}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Staging preview';
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install wrangler
        run: npm ci --ignore-scripts

      - name: Delete branch deployments
        run: |
          set -euo pipefail
          raw="${{ github.head_ref }}"
          safe="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g' | cut -c1-58)"
          echo "Cleaning deployments for branch=$safe"
          export SAFE_BRANCH="$safe"
          npx wrangler pages deployment list --project-name=nessebar-lens --json > /tmp/deps.json || true
          python3 - <<'PY'
          import json, os, subprocess, sys
          branch = os.environ.get("SAFE_BRANCH") or ""
          try:
              deps = json.load(open("/tmp/deps.json"))
          except Exception as e:
              print("no deployments list:", e)
              sys.exit(0)
          if isinstance(deps, dict):
              deps = deps.get("result") or deps.get("deployments") or []
          deleted = 0
          for d in deps:
              b = (d.get("deployment_trigger") or {}).get("metadata", {}).get("branch") or d.get("branch") or ""
              did = d.get("id")
              if did and b == branch:
                  print("delete", did, b)
                  subprocess.run(
                      ["npx", "wrangler", "pages", "deployment", "delete", did, "--project-name=nessebar-lens", "--force"],
                      check=False,
                  )
                  deleted += 1
          print(f"deleted={deleted}")
          PY

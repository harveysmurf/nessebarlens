name: Verify Stripe integration

# The refund/dispute revocation path (#101) resolves an order by asking Stripe
# which Checkout Session a payment came from, and a dispute's payload shape to
# get there. Both were written against documented API shapes and unit-tested
# against stubs -- a stub that disagrees with the real API is indistinguishable
# from a correct one. This runs the real test-mode API so those two assumptions
# are executed rather than assumed.
#
# Needs the account to already hold one completed Checkout Session (#134): there
# is no server-side completion API, so the lookup is checked against a real
# completed session rather than one the script completes itself. The browser E2E
# flow creates them; a fresh test account fails with that in the message.
#
# Deliberately NOT part of ci.yml: it needs the staging environment's secrets
# and creates real objects in the Stripe test environment, so it runs on its own
# schedule and on demand rather than gating every unrelated pull request.
on:
  workflow_dispatch:
  schedule:
    # Off the hour on weekdays: catches a Stripe-side change to these shapes
    # within a day rather than at deploy time.
    - cron: "37 6 * * 1-5"

# Default to the least privilege every job here needs: read the
# repository and nothing else. No job in this workflow calls the
# GitHub API, writes a comment, or pushes anything, so the default
# token (write-all inside a repo) was strictly more than the work
# required. A job needing more declares it on the job.
permissions:
  contents: read

concurrency:
  group: verify-stripe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Stripe test-mode integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      # The checkout is for the repository, not for the local action: `$/`
      # loads .github/actions/setup from the running commit, so it does not
      # depend on the workspace being populated first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Confirm the key is test mode before anything else
        # The script refuses a non-sk_test_ key too. This fails the run at the
        # step level so a live-mode key cannot reach a script that creates
        # disputes, even if that script's own guard is later broken.
        run: |
          set -euo pipefail
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) echo "key is test mode" ;;
            *) echo "::error::STRIPE_SECRET_KEY is not a test key — refusing to run"; exit 1 ;;
          esac

      - name: Verify Stripe integration
        run: node scripts/verify-stripe-integration.mjs

  # #199: a weekday cron that fails silently is a Stripe-side change that goes
  # unnoticed for days. The ref guard is needed despite that: `schedule` does run
  # on main by definition, but `workflow_dispatch` above lets an operator fire
  # this on any branch, and a green branch run must not close a live incident.
  notify:
    name: Notify incident
    needs: verify
    if: failure() && github.ref == 'refs/heads/main'

    # #206 regression: a called workflow cannot hold a permission the caller did
    # not grant, so `notify-failure.yml`'s `issues: write` used to make every
    # caller startup-fail. Granted here, on the two jobs that actually write
    # issues -- the deploy and cron jobs keep `contents: read` and never see it.
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/notify-failure.yml
    with:
      title: "incident: Stripe verification failing on main"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  resolve:
    name: Close incident
    needs: verify
    if: success() && github.ref == 'refs/heads/main'

    # #206 regression: a called workflow cannot hold a permission the caller did
    # not grant, so `notify-failure.yml`'s `issues: write` used to make every
    # caller startup-fail. Granted here, on the two jobs that actually write
    # issues -- the deploy and cron jobs keep `contents: read` and never see it.
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/notify-failure.yml
    with:
      title: "incident: Stripe verification failing on main"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      close: true
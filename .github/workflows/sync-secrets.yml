name: Sync Pages secrets

# Rotating a credential must not require shipping a build. This workflow is the
# only thing that writes deployment_configs.env_vars for production, so a key
# rotation is one button press instead of "change a secret, then find something
# to commit so the deploy runs".
#
# The read-back step after the sync answers the question this workflow exists to
# settle: does a PATCH of deployment_configs reach the deployment that is
# already serving traffic, or only the next one? If it only reaches the next
# one, zero-deploy rotation is a lie and the sync has to move to
# `wrangler pages secret put` (which writes runtime secrets, not
# deployment-bound env_vars).

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Optional plain-text marker to write as SYNC_PROBE, for the read-back check"
        required: false
        type: string

# Same group as prod.yml on purpose: both write the Pages project's config, and
# interleaving a sync with a deploy would leave the winner's values depending on
# which request landed last. This makes them queue instead.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync production runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Pages production runtime secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}
          # Live Prodigi host — this workflow only ever syncs production.
          PRODIGI_API_BASE: https://api.prodigi.com
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
          SYNC_PROBE: ${{ github.event.inputs.probe }}
        run: bash scripts/sync-pages-secrets.sh production

      - name: Read back the serving deployment's env vars
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_PROBE: ${{ github.event.inputs.probe }}
        run: bash scripts/pages-env-readback.sh

name: Photo master attestation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

# This workflow deliberately runs code from the base branch. It reads PR YAML
# through GitHub's API as data and never checks out or executes the PR head.
permissions:
  contents: read

concurrency:
  group: photo-master-attestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pending:
    name: Publish photo master status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: $/.github/actions/setup

      - name: Mark production photo status pending
        run: node --import ./scripts/register.mjs scripts/photo-master-attestation.mjs pending

  inspect:
    name: Inspect changed photo entries
    needs: pending
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-published-photos: ${{ steps.inspect.outputs.has-published-photos }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: $/.github/actions/setup

      - name: Inspect changed published photo YAML
        id: inspect
        run: node --import ./scripts/register.mjs scripts/photo-master-attestation.mjs inspect

  verify:
    name: Verify production photo assets
    needs: inspect
    if: needs.inspect.outputs.has-published-photos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_MASTERS_READ_ACCESS_KEY_ID: ${{ secrets.R2_MASTERS_READ_ACCESS_KEY_ID }}
      R2_MASTERS_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_MASTERS_READ_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: $/.github/actions/setup

      - name: Build the trusted base catalog
        run: npm run build:catalog

      - name: Wait for promoted production photo assets
        run: node --import ./scripts/register.mjs scripts/photo-master-attestation.mjs verify

  report:
    name: Report photo master status
    if: always()
    needs: [inspect, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      INSPECT_RESULT: ${{ needs.inspect.result }}
      HAS_PUBLISHED_PHOTOS: ${{ needs.inspect.outputs.has-published-photos }}
      VERIFY_RESULT: ${{ needs.verify.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: $/.github/actions/setup

      - name: Report the final production photo status
        run: node --import ./scripts/register.mjs scripts/photo-master-attestation.mjs report

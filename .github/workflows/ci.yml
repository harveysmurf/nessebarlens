name: CI

on:
  pull_request:
    branches: [main]
  # No push trigger on purpose: release.yml calls this workflow as a reusable
  # workflow and gates deploy on it, so a main push already runs the suite
  # through release's `checks` job. Leaving `push` here ran it twice per merge.
  workflow_call:

# Default to the least privilege every job here needs: read the
# repository and nothing else. No job in this workflow calls the
# GitHub API, writes a comment, or pushes anything, so the default
# token (write-all inside a repo) was strictly more than the work
# required. A job needing more declares it on the job.
permissions:
  contents: read

concurrency:
  # Namespaced by ref, not by workflow name: `github.workflow` resolves to the
  # CALLER's name inside a reusable workflow, so a prod-called run and a
  # pull-request run of the same file would not share a group. Pull requests
  # are superseded freely; the production caller does not use this workflow's
  # concurrency (release.yml serializes with cancel-in-progress: false).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The checkout is for the repository, not for the local action: `$/`
      # loads .github/actions/setup from the running commit, so it does not
      # depend on the workspace being populated first.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Lint
        run: npm run lint

      # Type-level constraints cannot die in a test: a Record keyed by a mapped
      # type, a Record<union, string> label table, a `satisfies` guard — all of
      # them are enforced by the compiler or not at all. Tests prove runtime
      # behaviour and are blind here, so this needs its own gate. Before this
      # step the only typecheck was `next build` in the preview job, one job
      # later than a green "Lint & test" on a pull request implied.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage floors
        run: npm run coverage

  # #112: a workflow linter in CI, scoped to the class of bug the issue is
  # about. `preview.yml` used to interpolate `github.head_ref` — the PR
  # author's branch name — straight into a `run:` block on a job holding
  # Cloudflare deploy credentials, so a branch named `a"; curl …; #` was shell
  # source in a job that can deploy. The `env:` fix closed that hole; this job
  # is what stops it reopening.
  #
  # Scoped to `template-injection` at Medium confidence and up, which is the
  # narrowest honest gate. The scope was set when a plain `zizmor` run was not
  # green on this repo: 40 other findings (12 unpinned-uses, 11
  # excessive-permissions, 9 self-repository, 8 artipacked) were real work and
  # out of scope for #112. #165 fixed all four classes — every action is now
  # SHA-pinned with a version comment, every workflow declares
  # `permissions: contents: read`, every checkout sets
  # `persist-credentials: false`, and same-repo references use `$/`. What is
  # left is 3 Low/Informational `template-injection` findings and nothing else.
  #
  # The gate stays scoped to `template-injection` even now that the rest is
  # clean, because the confidence floor is what keeps it honest: it is the axis
  # that separates our hole from already-hardened code. Widening it to
  # "everything zizmor reports" would re-open the false red the next sanitized
  # step-output interpolation triggers.
  #
  # The confidence floor is what keeps this from being permanently red on
  # already-hardened code. The remaining `template-injection` findings are the
  # sanitized `steps.branch.outputs.name` interpolations, which zizmor rates
  # Low/Informational because it cannot trace the value back through
  # scripts/sanitize-branch-name.sh. Measured on this repo: 2 findings at
  # High/High before the `env:` fix, 0 at Medium or above after it. Do not
  # switch to `--persona auditor`/`pedantic` — they promote those sanitized
  # findings to High confidence and reopen the false red.
  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # zizmor ships on PyPI, which sidesteps the whole class of "how do we
      # install a binary in CI" (per-OS assets, checksums, arch detection) and
      # pins cleanly. The exact version matters: the gate parses zizmor's JSON
      # output, so an unpinned upgrade could change the shape it reads.
      - name: Install zizmor
        run: pip install --disable-pip-version-check zizmor==1.30.1

      - name: Gate on workflow script injection
        run: node scripts/zizmor-gate.mjs

  # #143: the browser smoke flow, split by what it can actually promise.
  #
  # Everything that stays on our own pages — the five seeded success-page states
  # and the live-key guard — is the gate. It is deterministic, needs no Stripe or
  # Prodigi secret, and is the coverage a red PR can honestly be read against.
  #
  # The specs that leave for checkout.stripe.com are not. Stripe gates that page
  # behind an hCaptcha token and an explicit "I am an AI agent" attestation, and
  # the attestation is a question whose answer is supposed to be a human's, so
  # there is no acceptable automated way through it. They run, they report, and
  # they do not block: see `e2e-hosted-checkout` below.
  e2e-smoke:
    name: E2E smoke flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # The seeded states are read through a real page render, so this job still
      # needs a browser even though it never touches a third party.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No secret guards in this job, deliberately. Every spec it runs is
      # seeded, so there is no key whose absence could turn a spec into a skip
      # that still reads green — which is exactly what the two guard steps below
      # exist to prevent. A consequence worth keeping: this gate also runs on
      # fork pull requests, where GitHub withholds environment and repository
      # secrets, and it needs none.
      - name: E2E smoke flow (seeded)
        run: npm run test:e2e -- --grep-invert @hosted

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The hosted round-trip: configurator → Stripe's own checkout page → our
  # success page. Useful when it works, and partly outside our control.
  #
  # Two specs live under `@hosted` and they are not equally blocked (#169):
  #
  #   - physical print reaches Stripe and then cancels. Nothing is ever
  #     submitted, so Stripe's bot check and AI attestation never come into it,
  #     and this spec can genuinely pass. It is the job's real signal — a red
  #     here means the Prodigi quote, the checkout redirect or the cancel page
  #     regressed.
  #   - digital licence pays on that page, which is exactly what the
  #     attestation gates. It cannot pass on a runner, so HOSTED_DIGITAL_SKIP_REASON
  #     is set below and the spec skips itself with that reason in the report.
  #
  # The job still reports orange whenever something real breaks, which is what
  # `continue-on-error` was for; #169 removed the guaranteed-red half rather
  # than the reporting. The skip is a spec-level skip, not a grep exclusion, so
  # the test list still shows the digital flow as skipped with its reason
  # instead of it quietly disappearing from coverage.
  e2e-hosted-checkout:
    name: E2E hosted checkout (best effort)
    # #224: Dependabot-triggered runs are given no Actions or Environment
    # secrets, so `secrets.STRIPE_SECRET_KEY` and friends resolve empty on
    # every `dependabot[bot]` push and the two `Require a ... key` guards below
    # fail. Skip the job rather than failing it: the guard's whole point is to
    # turn a missing key into a visible red, and a Dependabot run has no key by
    # design, not by accident. `github.actor`, not `github.triggering_actor`: a
    # human re-run of a Dependabot run still has no secrets, and the actor stays
    # `dependabot[bot]` for it, so the job is correctly skipped there too.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    continue-on-error: true
    # The sandbox Stripe and Prodigi keys are staging Environment secrets, not
    # repository ones. Without this line `secrets.*` resolves to the repository
    # scope, both guard steps fail on every pull request, and the flow never
    # runs. Same environment preview.yml deploys from, so the flow quotes and
    # checks out against the same sandbox the preview is built with.
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # The flow drives a real Stripe sandbox checkout page, so the browser is a
      # hard dependency rather than something to skip when it is slow.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Without a key the Stripe specs skip themselves and the job reports
      # nothing but a skip — a partial pass that looks green. Failing here says
      # the secret is missing, which is the thing to fix.
      #
      # What this guard no longer does, now that the job is continue-on-error: it
      # no longer blocks. A missing or wrong key turns the job orange with the
      # message above rather than failing the run, so a staged secret can be
      # removed without anyone being stopped by it. That is consistent with the
      # job being best-effort, and the message is the signal — but do not read
      # these two steps as gates. The check that has real teeth is the live-key
      # guard test in the required job, which fails closed with no key at all.
      - name: Require a Stripe test key
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::staging.STRIPE_SECRET_KEY is not set. The checkout flow skips itself without a key, so the job would pass having tested nothing." >&2
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::staging.STRIPE_SECRET_KEY is not an sk_test_ key. This job must never drive a live card path." >&2; exit 1 ;;
          esac
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      # The same partial-green trap the Stripe guard blocks one step earlier:
      # the physical-print spec test.skips() without this key, so a missing
      # Prodigi secret would leave the job green having never quoted Prodigi.
      - name: Require a Prodigi sandbox key
        run: |
          if [ -z "$PRODIGI_SANDBOX_API_KEY" ]; then
            echo "::error::PRODIGI_SANDBOX_API_KEY is not set. The physical-print spec skips itself without a key, so the job would pass having quoted nothing." >&2
            exit 1
          fi
        env:
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}

      # A physical order cannot be charged without this one: /api/checkout fails
      # closed with 503 when it cannot sign a master asset URL, so the
      # physical-print spec would wait on a Checkout button that can never
      # enable. No guard step for the same reason as the two above — the spec
      # itself asserts the failure, so a missing secret is a red test, not a
      # silent skip.
      # Headed under Xvfb, not headless. Stripe gates the hosted-checkout submit
      # on a bot check, and on a runner the token never arrives: the network
      # trace of the last red run shows `getcaptcha` with no matching
      # `checkcaptcha`, and the page simply never leaves after Pay. A real
      # display and a real window is the closest a runner gets to a browser a
      # person would use, which is what the bot check is measuring.
      #
      # Since #169 nothing here submits a payment — the digital flow skips itself
      # and the physical one cancels — so the gate no longer applies to what is
      # left of the job, and this stays only for anyone re-enabling the digital
      # run by hand. It was never believed to hold against the attestation
      # dialog that replaced the bot check.
      - name: E2E hosted checkout
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e -- --grep @hosted
        env:
          HEADED: "1"
          # #169: the digital-licence flow submits a payment on Stripe's hosted
          # page, behind an AI-attestation dialog that is not ours to click.
          HOSTED_DIGITAL_SKIP_REASON: "Stripe's AI-attestation gate blocks the hosted submit in CI (#169)"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}

      # Uploaded unconditionally, not `if: failure()`. This job is soft-failed,
      # so a Stripe gate block is a run that a human is expected to read, and
      # the page state that explains it lives only in the trace.
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-hosted-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # #204: run the built Worker, not `next dev`. Every other job here exercises
  # Node and Next; the artifact we ship is `.open-next` in workerd with real
  # bindings (`ORDERS_DB`, `MASTERS`, `ASSETS` with `run_worker_first`) and
  # secrets delivered as bindings. Until this job, that runtime was first
  # exercised by a deployed preview's smoke or by production itself — which is
  # where #190 (NEXT_PUBLIC_SITE_URL never reached the Worker) and #188/#173 (a
  # binding missing from the deploy) were found.
  #
  # Deliberately NOT pull_request-only like the two jobs above: this is the only
  # gate that proves the artifact boots, so release.yml running it against the
  # same tree is the point, not a redundant re-run (#200).
  #
  # No secrets and no `environment:`: `wrangler dev` local mode is Miniflare and
  # the only credentials are the non-secret `.dev.vars` written below, so it runs
  # on fork pull requests too.
  e2e-worker:
    name: E2E Worker runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # Next's compile cache only, keyed on the lockfile and `src/**`: a source or
      # dependency change rebuilds, a docs-only change reuses it.
      - name: Cache build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Everything the local Worker needs to boot, from non-secret test values.
      # `wrangler d1`/`r2` and `preview` all default to the same `.wrangler/state`
      # persistence, which is what makes the seeded master and the migrated schema
      # the binding the Worker actually reads.
      - name: Prepare the local Worker
        run: |
          cat > .dev.vars <<'EOF'
          NEXT_PUBLIC_SITE_URL=http://localhost:8787
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_dummy_e2e
          PRINT_ASSET_HMAC_SECRET=0123456789abcdef0123456789abcdef
          PRODIGI_WEBHOOK_TOKEN=e2e-prodigi-webhook-token
          RECONCILE_SECRET=e2e-reconcile-secret
          RESEND_API_KEY=re_e2e_dummy
          EOF
          npx wrangler d1 migrations apply nessebar-lens-orders --local
          npx wrangler r2 object put nessebar-lens-masters/prints/dawn.jpg --local --file e2e/fixtures/worker-master.jpg

      # The #190 acceptance: without NEXT_PUBLIC_SITE_URL the production build's
      # guard (siteUrl()) throws here, before the Worker is ever started. It is a
      # step `env:`, not a `.dev.vars` value, because `next build` reads
      # process.env and never `.dev.vars`.
      - name: Build the Worker
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:8787

      - name: Start the Worker
        run: |
          npx opennextjs-cloudflare preview > /tmp/worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8787/ -o /dev/null; then
              echo "the Worker answered on http://localhost:8787"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the Worker did not answer on http://localhost:8787 within 120s" >&2
          tail -50 /tmp/worker.log >&2
          exit 1

      - name: E2E against the Worker
        run: npm run test:e2e -- --grep-invert @hosted
        env:
          E2E_BASE_URL: http://localhost:8787
          PRINT_ASSET_HMAC_SECRET: 0123456789abcdef0123456789abcdef
          PRODIGI_WEBHOOK_TOKEN: e2e-prodigi-webhook-token

      - name: Smoke test the Worker
        run: bash scripts/smoke.sh http://localhost:8787

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-worker-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

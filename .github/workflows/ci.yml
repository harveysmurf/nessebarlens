name: CI

on:
  pull_request:
    branches: [main]
  # No push trigger on purpose: prod.yml calls this workflow as a reusable
  # workflow and gates deploy on it, so a main push already runs the suite
  # through prod's `checks` job. Leaving `push` here ran it twice per merge.
  workflow_call:

concurrency:
  # Namespaced by ref, not by workflow name: `github.workflow` resolves to the
  # CALLER's name inside a reusable workflow, so a prod-called run and a
  # pull-request run of the same file would not share a group. Pull requests
  # are superseded freely; the production caller does not use this workflow's
  # concurrency (prod.yml serializes with cancel-in-progress: false).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A local action must exist on disk before it can run, so the checkout
      # that loads it cannot itself live inside it.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      # Type-level constraints cannot die in a test: a Record keyed by a mapped
      # type, a Record<union, string> label table, a `satisfies` guard — all of
      # them are enforced by the compiler or not at all. Tests prove runtime
      # behaviour and are blind here, so this needs its own gate. Before this
      # step the only typecheck was `next build` in the preview job, one job
      # later than a green "Lint & test" on a pull request implied.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage floors
        run: npm run coverage

  # #143: the browser smoke flow. A separate job rather than a step in
  # lint-and-test because it needs a Chromium download (~150MB) and a running
  # dev server, and neither should be able to fail a lint.
  #
  # `if: pull_request` is deliberate: prod.yml calls this workflow as a reusable
  # workflow before deploying, and re-running a browser flow on every production
  # merge buys nothing — lint-and-test already gates the deploy, and the flow
  # tests the same commit that pull_request validated.
  e2e-smoke:
    name: E2E smoke flow
    if: github.event_name == 'pull_request'
    # The sandbox Stripe and Prodigi keys are staging Environment secrets, not
    # repository ones. Without this line `secrets.*` resolves to the repository
    # scope, both guard steps fail on every pull request, and the flow never
    # runs. Same environment preview.yml deploys from, so the flow quotes and
    # checks out against the same sandbox the preview is built with.
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The flow drives a real Stripe sandbox checkout page, so the browser is a
      # hard dependency rather than something to skip when it is slow.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Without a key the Stripe specs skip themselves and only the success-page
      # states run — a partial pass that looks green. Failing here says the
      # secret is missing, which is the thing to fix.
      - name: Require a Stripe test key
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::staging.STRIPE_SECRET_KEY is not set. The checkout flow skips itself without a key, so the job would pass having tested nothing." >&2
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::staging.STRIPE_SECRET_KEY is not an sk_test_ key. This job must never drive a live card path." >&2; exit 1 ;;
          esac
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      # The same partial-green trap the Stripe guard blocks one step earlier:
      # the physical-print spec test.skips() without this key, so a missing
      # Prodigi secret would leave the job green having never quoted Prodigi.
      - name: Require a Prodigi sandbox key
        run: |
          if [ -z "$PRODIGI_SANDBOX_API_KEY" ]; then
            echo "::error::PRODIGI_SANDBOX_API_KEY is not set. The physical-print spec skips itself without a key, so the job would pass having quoted nothing." >&2
            exit 1
          fi
        env:
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}

      # A physical order cannot be charged without this one: /api/checkout fails
      # closed with 503 when it cannot sign a master asset URL, so the
      # physical-print spec would wait on a Checkout button that can never
      # enable. No guard step for the same reason as the two above — the spec
      # itself asserts the failure, so a missing secret is a red test, not a
      # silent skip.
      # Headed under Xvfb, not headless. Stripe gates the hosted-checkout submit
      # on an hCaptcha token, and on a runner the token never arrives: the
      # network trace of the last red run shows `getcaptcha` with no matching
      # `checkcaptcha`, and the page simply never leaves after Pay. A real
      # display and a real window is the closest a runner gets to a browser a
      # person would use, which is what the bot check is measuring.
      - name: E2E smoke flow
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e
        env:
          HEADED: "1"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}

      # The failure that motivates this is unreadable without it: a Stripe
      # timeout in a browser flow reports a line number and a URL regex, and
      # the page state that explains it lives only in the trace. Uploading on
      # failure rather than always keeps a green run free of a Chromium-sized
      # artifact nobody downloads.
      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

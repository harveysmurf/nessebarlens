name: CI

on:
  pull_request:
    branches: [main]
  # No push trigger on purpose: prod.yml calls this workflow as a reusable
  # workflow and gates deploy on it, so a main push already runs the suite
  # through prod's `checks` job. Leaving `push` here ran it twice per merge.
  workflow_call:

concurrency:
  # Namespaced by ref, not by workflow name: `github.workflow` resolves to the
  # CALLER's name inside a reusable workflow, so a prod-called run and a
  # pull-request run of the same file would not share a group. Pull requests
  # are superseded freely; the production caller does not use this workflow's
  # concurrency (prod.yml serializes with cancel-in-progress: false).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A local action must exist on disk before it can run, so the checkout
      # that loads it cannot itself live inside it.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      # Type-level constraints cannot die in a test: a Record keyed by a mapped
      # type, a Record<union, string> label table, a `satisfies` guard — all of
      # them are enforced by the compiler or not at all. Tests prove runtime
      # behaviour and are blind here, so this needs its own gate. Before this
      # step the only typecheck was `next build` in the preview job, one job
      # later than a green "Lint & test" on a pull request implied.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage floors
        run: npm run coverage

  # #112: a workflow linter in CI, scoped to the class of bug the issue is
  # about. `preview.yml` used to interpolate `github.head_ref` — the PR
  # author's branch name — straight into a `run:` block on a job holding
  # Cloudflare deploy credentials, so a branch named `a"; curl …; #` was shell
  # source in a job that can deploy. The `env:` fix closed that hole; this job
  # is what stops it reopening.
  #
  # Scoped to `template-injection` at Medium confidence and up, which is the
  # narrowest honest gate. A plain `zizmor` run is not green on this repo and no
  # --min-severity / --min-confidence / --persona combination makes it green:
  # there are 40 other findings (12 unpinned-uses, 11 excessive-permissions,
  # 9 self-repository, 8 artipacked) that are real work and out of scope here.
  # They are printed by the script, not gated on, and are tracked in the
  # sibling issue. A gate nobody can satisfy is a gate everyone learns to skip.
  #
  # The confidence floor is what keeps this from being permanently red on
  # already-hardened code. The remaining `template-injection` findings are the
  # sanitized `steps.branch.outputs.name` interpolations, which zizmor rates
  # Low/Informational because it cannot trace the value back through
  # scripts/sanitize-branch-name.sh. Measured on this repo: 2 findings at
  # High/High before the `env:` fix, 0 at Medium or above after it. Do not
  # switch to `--persona auditor`/`pedantic` — they promote those sanitized
  # findings to High confidence and reopen the false red.
  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # zizmor ships on PyPI, which sidesteps the whole class of "how do we
      # install a binary in CI" (per-OS assets, checksums, arch detection) and
      # pins cleanly. The exact version matters: the gate parses zizmor's JSON
      # output, so an unpinned upgrade could change the shape it reads.
      - name: Install zizmor
        run: pip install --disable-pip-version-check zizmor==1.30.1

      - name: Gate on workflow script injection
        run: node scripts/zizmor-gate.mjs

  # #143: the browser smoke flow, split by what it can actually promise.
  #
  # Everything that stays on our own pages — the five seeded success-page states
  # and the live-key guard — is the gate. It is deterministic, needs no Stripe or
  # Prodigi secret, and is the coverage a red PR can honestly be read against.
  #
  # The specs that leave for checkout.stripe.com are not. Stripe gates that page
  # behind an hCaptcha token and an explicit "I am an AI agent" attestation, and
  # the attestation is a question whose answer is supposed to be a human's, so
  # there is no acceptable automated way through it. They run, they report, and
  # they do not block: see `e2e-hosted-checkout` below.
  e2e-smoke:
    name: E2E smoke flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The seeded states are read through a real page render, so this job still
      # needs a browser even though it never touches a third party.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No secret guards in this job, deliberately. Every spec it runs is
      # seeded, so there is no key whose absence could turn a spec into a skip
      # that still reads green — which is exactly what the two guard steps below
      # exist to prevent. A consequence worth keeping: this gate also runs on
      # fork pull requests, where GitHub withholds environment and repository
      # secrets, and it needs none.
      - name: E2E smoke flow (seeded)
        run: npm run test:e2e -- --grep-invert @hosted

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The hosted round-trip: configurator → Stripe's own checkout page → our
  # success page. Genuinely useful when it works, and structurally outside our
  # control, so it is `continue-on-error` rather than skipped.
  #
  # `continue-on-error`, not `if: always()` on the specs and not a skip. A skip
  # would go green while testing nothing, which is the silent-untested trap: the
  # next red would have no way to say whether Stripe's gate moved or our
  # redirect broke. Attempting the run keeps the trace and the test list, so a
  # human can tell those two apart. The cost is that this job reports orange
  # whenever the gate bites, which is the point — the signal stays visible
  # instead of disappearing into a green check.
  e2e-hosted-checkout:
    name: E2E hosted checkout (best effort)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    # The sandbox Stripe and Prodigi keys are staging Environment secrets, not
    # repository ones. Without this line `secrets.*` resolves to the repository
    # scope, both guard steps fail on every pull request, and the flow never
    # runs. Same environment preview.yml deploys from, so the flow quotes and
    # checks out against the same sandbox the preview is built with.
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The flow drives a real Stripe sandbox checkout page, so the browser is a
      # hard dependency rather than something to skip when it is slow.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Without a key the Stripe specs skip themselves and the job reports
      # nothing but a skip — a partial pass that looks green. Failing here says
      # the secret is missing, which is the thing to fix.
      #
      # What this guard no longer does, now that the job is continue-on-error: it
      # no longer blocks. A missing or wrong key turns the job orange with the
      # message above rather than failing the run, so a staged secret can be
      # removed without anyone being stopped by it. That is consistent with the
      # job being best-effort, and the message is the signal — but do not read
      # these two steps as gates. The check that has real teeth is the live-key
      # guard test in the required job, which fails closed with no key at all.
      - name: Require a Stripe test key
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::staging.STRIPE_SECRET_KEY is not set. The checkout flow skips itself without a key, so the job would pass having tested nothing." >&2
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::staging.STRIPE_SECRET_KEY is not an sk_test_ key. This job must never drive a live card path." >&2; exit 1 ;;
          esac
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      # The same partial-green trap the Stripe guard blocks one step earlier:
      # the physical-print spec test.skips() without this key, so a missing
      # Prodigi secret would leave the job green having never quoted Prodigi.
      - name: Require a Prodigi sandbox key
        run: |
          if [ -z "$PRODIGI_SANDBOX_API_KEY" ]; then
            echo "::error::PRODIGI_SANDBOX_API_KEY is not set. The physical-print spec skips itself without a key, so the job would pass having quoted nothing." >&2
            exit 1
          fi
        env:
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}

      # A physical order cannot be charged without this one: /api/checkout fails
      # closed with 503 when it cannot sign a master asset URL, so the
      # physical-print spec would wait on a Checkout button that can never
      # enable. No guard step for the same reason as the two above — the spec
      # itself asserts the failure, so a missing secret is a red test, not a
      # silent skip.
      # Headed under Xvfb, not headless. Stripe gates the hosted-checkout submit
      # on a bot check, and on a runner the token never arrives: the network
      # trace of the last red run shows `getcaptcha` with no matching
      # `checkcaptcha`, and the page simply never leaves after Pay. A real
      # display and a real window is the closest a runner gets to a browser a
      # person would use, which is what the bot check is measuring. It is worth
      # saying plainly that this is not expected to be enough — a later run
      # added an attestation dialog in front of the same submit. It stays because
      # the job no longer depends on it, not because it is believed to hold.
      - name: E2E hosted checkout
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e -- --grep @hosted
        env:
          HEADED: "1"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}

      # Uploaded unconditionally, not `if: failure()`. This job is soft-failed,
      # so a Stripe gate block is a run that a human is expected to read, and
      # the page state that explains it lives only in the trace.
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hosted-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

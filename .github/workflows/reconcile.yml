name: Reconcile orders

# Operator-only since #201: the schedule is now a Cloudflare Cron Trigger
# ([triggers] crons in wrangler.toml, driven by worker.ts's `scheduled`). GitHub
# asked for every 15 minutes and actually delivered about 11 runs in 42 hours --
# scheduled workflows are best-effort and get delayed or dropped, worst on a
# low-activity repo. Keep this file as the one-shot path, and as the fallback
# for one release while the Cron Trigger is proven in the logs; delete it in the
# follow-up #201 asks for.
#
# workflow_dispatch is not a convenience: it is how an operator forces a drain
# after rotating a Prodigi key, or right now, and it is also what a Cloudflare
# Cron Trigger failure would fall back to. The `concurrency` group below is what
# stops a dispatch overlapping the Worker cron: the route dedupes per order via
# D1 claims, so overlap is safe, just wasteful of Stripe quota.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-orders
  # Two runs must never overlap — the route is safe under concurrency thanks to
  # D1 claims, but overlapping cron ticks still waste Stripe quota and muddy
  # the summary logs. cancel-in-progress: false so a long run is not killed.
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # production Environment holds SITE_URL + RECONCILE_SECRET (same pattern
    # as release.yml). A repository-level secret would also work; match prod.
    environment: production
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
    steps:
      - name: Call reconcile
        # Secrets pass through env: and are never interpolated into the run
        # block — the zizmor template-injection gate (Medium+) requires it.
        # See scripts/zizmor-gate.mjs and ci.yml's workflow-audit job.
        env:
          SITE_URL: ${{ env.SITE_URL }}
          RECONCILE_SECRET: ${{ env.RECONCILE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "SITE_URL is empty — check the production Environment secret" >&2
            exit 1
          fi
          if [ -z "${RECONCILE_SECRET:-}" ]; then
            echo "RECONCILE_SECRET is empty — check the production Environment secret" >&2
            exit 1
          fi
          base="${SITE_URL%/}"
          curl -fsS -X POST \
            -H "x-reconcile-secret: ${RECONCILE_SECRET}" \
            -H "content-type: application/json" \
            "${base}/api/internal/reconcile"

  # #199: six consecutive cron failures (a missing RECONCILE_SECRET, fixed in
  # #191) were invisible for a day, during which a paid order that missed its
  # webhook would never have been recovered. `workflow_dispatch` runs are on
  # main too, so an operator-triggered failure pages the same way.
  notify:
    name: Notify incident
    needs: reconcile
    if: failure() && github.ref == 'refs/heads/main'

    # #206 regression: a called workflow cannot hold a permission the caller did
    # not grant, so `notify-failure.yml`'s `issues: write` used to make every
    # caller startup-fail. Granted here, on the two jobs that actually write
    # issues -- the deploy and cron jobs keep `contents: read` and never see it.
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/notify-failure.yml
    with:
      title: "incident: Reconcile cron failing on main"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  resolve:
    name: Close incident
    needs: reconcile
    if: success() && github.ref == 'refs/heads/main'

    # #206 regression: a called workflow cannot hold a permission the caller did
    # not grant, so `notify-failure.yml`'s `issues: write` used to make every
    # caller startup-fail. Granted here, on the two jobs that actually write
    # issues -- the deploy and cron jobs keep `contents: read` and never see it.
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/notify-failure.yml
    with:
      title: "incident: Reconcile cron failing on main"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      close: true

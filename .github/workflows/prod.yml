name: Production

on:
  push:
    branches: [main]
  # A secret-only change (rotated Stripe key, new Prodigi credential) has no
  # commit to trigger a deploy, and the sync step at the bottom of this
  # workflow is what actually applies it. Without a manual trigger, rotating
  # a credential means committing an empty change to production.
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Assemble Pages bundle
        run: bash scripts/assemble-pages-out.sh

      # The sha and message arrive via env, never interpolated straight into the
      # script. A commit message
      # is free-form text: backticks in it became command substitution inside
      # the double quotes and wrangler died on the shell's output. This failed
      # the deploy of a merge whose message quoted a file path.
      - name: Deploy Pages production
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx wrangler pages deploy .pages-out \
            --project-name=nessebar-lens \
            --branch=main \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$COMMIT_MESSAGE"

      # Secrets are not synced here. Rotating a credential must not require
      # shipping a build, and running the sync from the deploy is what forced
      # that coupling. Use the "Sync Pages secrets" workflow instead.

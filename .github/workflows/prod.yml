name: Production

on:
  push:
    branches: [main]
  # A secret-only change (rotated Stripe key, new Prodigi credential) has no
  # commit to trigger a deploy. On Workers a rotation does not need a rebuild at
  # all — `wrangler secret bulk` updates the deployed Worker in place — so the
  # manual trigger is a convenience that re-runs build+deploy, not a workaround
  # for a deployment-bound secret store. The standalone sync workflow the
  # Pages model required was removed for that reason and stays removed.
  workflow_dispatch:

# Default to the least privilege every job here needs: read the
# repository and nothing else. No job in this workflow calls the
# GitHub API, writes a comment, or pushes anything, so the default
# token (write-all inside a repo) was strictly more than the work
# required. A job needing more declares it on the job.
permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: $/.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
    steps:
      # The checkout is for the repository, not for the local action: `$/`
      # loads .github/actions/setup from the running commit, so it does not
      # depend on the workspace being populated first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      # The secrets go on the version this step deploys, via --secrets-file.
      # The order here is deliberate and is the reverse of the Pages workflow:
      #
      #   * syncing first would describe a version the deploy then replaced, and
      #   * syncing after is worse than useless. `wrangler versions secret bulk`
      #     PATCHes versions/latest, which mints a NEW version rather than
      #     editing the deployed one. Run after the deploy it would leave the
      #     rotated key sitting on a version that never serves, and prod would
      #     keep running the old key with a green run.
      #
      # --secrets-file has no such window: the deploying version carries its own
      # secrets from the moment it starts serving. It also matches what the
      # preview job does, so there is one mechanism to reason about.
      #
      # The script runs in version-only mode -- every #114 guard executes and
      # the JSON is written, but nothing is applied here. `deploy` applies it.
      - name: Deploy production (OpenNext)
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODIGI_WEBHOOK_TOKEN: ${{ secrets.PRODIGI_WEBHOOK_TOKEN }}
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          # Live Prodigi host — staging/preview stays on sandbox.
          PRODIGI_API_BASE: https://api.prodigi.com
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SYNC_SCOPE=version-only SECRETS_OUT=prod-secrets.json \
            bash scripts/sync-worker-secrets.sh production

          # The sha and message arrive via env, never interpolated straight into
          # the script. Passing them through env was always necessary -- a
          # backtick in a commit message became command substitution inside
          # double quotes, which failed a real deploy -- but it is NOT sufficient
          # here, and the comment above used to claim it was.
          #
          # opennextjs-cloudflare re-spawns wrangler with `shell: true`
          # (run-wrangler.js) without escaping passthrough args, so this shell's
          # quoting is discarded and a second shell re-parses the text. A commit
          # message is free-form, so it can contain a `#`, a backtick or a `;`
          # that the first shell handled correctly and the second one will not.
          # Any merge whose message contains one of those would take production
          # down with a mangled command.
          #
          # So the value is reduced here to something both shells pass through
          # unchanged. Measured against a stand-in for opennextjs's `shell: true`
          # re-parse, not assumed: a space arrives as several arguments, a `;`
          # runs a second command, and a backtick executes. Stripping
          # metacharacters alone is not enough -- spaces split too, and `(` `)`
          # are themselves metacharacters, so my first two attempts at this
          # allowlist both still failed. What is left is alphanumeric plus
          # `._/,-`, verified to survive every one of: a `#`, a `;`, a backtick,
          # a `$(...)`, a quote of either kind, and a multi-line body.
          SAFE_MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          SAFE_MESSAGE="$(printf '%s' "$SAFE_MESSAGE" | tr -cd 'A-Za-z0-9._/,-' | tr -d '[:space:]')"
          SAFE_MESSAGE="${SAFE_MESSAGE:0:72}"
          [ -n "$SAFE_MESSAGE" ] || SAFE_MESSAGE="deploy-$COMMIT_SHA"

          # No --commit-hash/--commit-dirty/--commit-message here: those are
          # Pages deploy flags. `wrangler deploy` rejects them outright --
          # "Unknown arguments: commit-dirty, commitDirty, commit-hash,
          # commitHash, commit-message, commitMessage" -- which failed every
          # production deploy on main from the Workers migration onwards
          # (run 37154161818), leaving production serving a pre-migration
          # build. --tag/--message are the Workers version identity and are
          # what preview.yml already uses. The head sha travels in --tag, so a
          # deployed version can still be traced back to its commit.
          # SAFE_MESSAGE is the human-readable commit message and only carries
          # the sha as its fallback.
          npx opennextjs-cloudflare deploy \
            --secrets-file=prod-secrets.json \
            --tag="prod-$COMMIT_SHA" \
            --message="$SAFE_MESSAGE"
          rm -f prod-secrets.json

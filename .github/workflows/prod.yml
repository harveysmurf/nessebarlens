name: Production

on:
  push:
    branches: [main]
  # A secret-only change (rotated Stripe key, new Prodigi credential) has no
  # commit to trigger a deploy. On Workers a rotation does not need a rebuild at
  # all — `wrangler secret bulk` updates the deployed Worker in place — so the
  # manual trigger is a convenience that re-runs build+deploy, not a workaround
  # for a deployment-bound secret store. The standalone sync workflow the
  # Pages model required was removed for that reason and stays removed.
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
    steps:
      # A local action must exist on disk before it can run, so the checkout
      # that loads it cannot itself live inside it.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build



      # The sha and message arrive via env, never interpolated straight into the
      # script. A commit message
      # is free-form text: backticks in it became command substitution inside
      # the double quotes and wrangler died on the shell's output. This failed
      # the deploy of a merge whose message quoted a file path.
      - name: Deploy production (OpenNext)
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx opennextjs-cloudflare deploy \
            --commit-dirty=true \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$COMMIT_MESSAGE"

      # Deploy BEFORE the sync, which is the reverse of the Pages order and the
      # reason the comment used to say the opposite. Worker secrets are not
      # frozen into a deployment: `versions secret bulk` attaches secrets to the
      # Worker Version and `secret bulk` updates the deployed Worker in place,
      # so a sync placed *before* the deploy would be describing a version the
      # deploy then replaced. Deploying first and syncing second means the
      # secrets land on what is actually serving.
      #
      # NEXT_PUBLIC_* are unaffected either way: those bake at build from the
      # GitHub Environment secrets, not from this script.
      - name: Sync production runtime secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PRINT_ASSET_HMAC_SECRET: ${{ secrets.PRINT_ASSET_HMAC_SECRET }}
          # Live Prodigi host — staging/preview stays on sandbox.
          PRODIGI_API_BASE: https://api.prodigi.com
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
          PRODIGI_SANDBOX_API_KEY: ${{ secrets.PRODIGI_SANDBOX_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB_IMAGES_BASE: ${{ secrets.NEXT_PUBLIC_WEB_IMAGES_BASE }}
        run: bash scripts/sync-worker-secrets.sh production

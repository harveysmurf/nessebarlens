name: Setup
description: Pin Node from .nvmrc and install dependencies

inputs:
  install-args:
    description: Extra arguments forwarded to npm ci
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        # Exact pin via .nvmrc, not a "24" range: 24.10 fails
        # tests/routes.test.mts on a loader change, so a floating major lets
        # CI and .nvmrc disagree. tests/node-version-pin.test.mts holds every
        # workflow and this action to node-version-file: .nvmrc.
        node-version-file: .nvmrc
        cache: npm

    - name: Install
      shell: bash
      # Through env, never interpolated into the script: an input is caller
      # supplied, and `${{ }}` is expanded at the workflow level, so a caller
      # that ever passed untrusted text here would hand it to bash as source.
      # The only caller passes the literal `--ignore-scripts`, so this is a
      # hardening of the mechanism rather than a live hole — but it is the same
      # class the zizmor gate refuses, and the gate would otherwise be red on
      # day one, which is how gates get skipped.
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted on purpose, with the array form doing the splitting instead:
      # INSTALL_ARGS is a list of flags, and quoting it would pass
      # "--ignore-scripts" to npm as one argument. An empty input must also
      # expand to zero arguments, which is what `run:` on its own would not do.
      run: |
        read -r -a args <<< "$INSTALL_ARGS"
        npm ci "${args[@]}"

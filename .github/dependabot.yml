# Issue #205 item 2: every action is SHA-pinned and every runtime dependency is
# on the money and deploy path, but nothing moved a pin. A SHA never drifts on
# its own, so "we pin" was doing no work until something watched the tags.
#
# Two ecosystems, deliberately configured differently:
#
#   * github-actions -- one group, weekly. Dependabot rewrites a SHA pin and
#     keeps the `# vX.Y.Z` comment in place, so the pin format
#     tests/workflow-hardening.test.mts enforces survives the bot. Grouped
#     because a Node-major action bump and the artifact bump that goes with it
#     only make sense together; one PR per action would open five PRs and
#     merge them in the wrong order.
#
#   * npm -- grouped by what breaks together. `next` with a stale `react` is a
#     broken tree; `wrangler` with a stale `@opennextjs/cloudflare` is a deploy
#     that fails at opennext's own compatibility check, not ours. Stripe is
#     alone because it is the payment path and its webhook payload shape is the
#     one thing in this repo with a real blast radius.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    # A pinned action that is also vulnerable is the case where waiting for the
    # weekly round is not good enough, so security updates stay on their own
    # (empty `groups` is the default: one PR per vulnerable action, immediately).
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns:
          - next
          - react
          - react-dom
      deploy:
        patterns:
          - wrangler
          - "@opennextjs/cloudflare"
      payments:
        patterns:
          - stripe
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - react-dom
          - wrangler
          - "@opennextjs/cloudflare"
          - stripe

    # #221: the dev-tooling catch-all bumped four dependencies across breaking
    # majors in a single PR — typescript 5→7, eslint 9→10, eslint-config-next
    # 15→16, @types/node 24→26 — and the tree broke. #237 lifted the
    # eslint-config-next hold (the framework group moved Next to 16, so the
    # lockstep catch-up became safe and was done by hand). The three that
    # remain are still real breaking-major holds under the Next 16 tree:
    #
    #   * typescript — typescript-eslint 8 (what eslint-config-next 16 bundles)
    #     declares `typescript >=4.8.4 <6.1.0`, so TS 6/7 have no supported
    #     parser. A TS-major move is a tree-wide change and earns its own PR.
    #   * eslint — eslint-plugin-react pins `eslint ^9.7`, and
    #     eslint-plugin-import and eslint-plugin-jsx-a11y pin `^9`; eslint 10 is
    #     not supported by the Next 16 lint tree yet.
    #   * @types/node — the Worker runs Node 24 (`engines` in package.json), so
    #     the types must describe the 24.x API, not the Node 25/26 releases.
    #   * next — Next 16.4.0 loads a new `.next/server/preview-props.json`
    #     manifest unconditionally at server boot
    #     (`NextNodeServer.getPreviewProps`), and @opennextjs/cloudflare inlines
    #     `loadManifest` with a whitelist that omits it, so the Worker boots and
    #     then 500s every request until OpenNext knows the manifest. Nothing
    #     released does -- 1.20.9 and the latest 1.20.10 both still throw
    #     `Unexpected loadManifest(...preview-props.json)`. Hold `next` at 16.3.x
    #     (#367); 16.3.x security patches still land under this floor.
    #
    # These are version *floors*, not blanket ignores: `versions: [">=6"]` still
    # lets a 5.x security patch through, which is what keeps this from being the
    # "ignore a vulnerable package" failure mode the test below bans.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "next"
        versions: [">=16.4.0"]

# Security updates are NOT controlled here. Dependabot alerts and security
# updates are repository settings (Settings -> Code security and analysis), and a
# disabled setting overrides anything this file says -- the 2026-10-11 audit
# found both off while this comment claimed they were on (#359). They must not be
# traded away for a tidier weekly cadence. tests/dependabot-config.test.mts pins
# the shape above; scripts/dependabot-settings.mjs checks the live settings by
# hand, because reading them needs admin access no CI job token can hold.

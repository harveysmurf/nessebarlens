# Nessebar Lens — Cloudflare (OpenNext Worker + static assets)
# Secrets via `wrangler secret put` / CF dashboard — never git.
# R2 S3 access keys are unused; Workers use bucket bindings only.
# Do NOT set pages_build_output_dir — that makes Wrangler treat this as a
# Pages config where the ASSETS binding name is reserved.
# run_worker_first=true: Pages always invokes the worker first; OpenNext must
# fetch static files via env.ASSETS itself.
#
# Do NOT add [triggers] crons here. OpenNext's generated .open-next/worker.js
# exports only `default { fetch }` plus the DO classes, so a cron trigger
# would be silently ignored. The reconciler is a Next route invoked by
# GitHub Actions — see DEVELOPMENT.md §5 and .github/workflows/reconcile.yml.

name = "nessebar-lens"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "nessebar-lens-orders"
database_id = "466035f5-fa14-4f0c-9d7a-2471025fe6f1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WEB"
bucket_name = "nessebar-lens-web"

[[r2_buckets]]
binding = "MASTERS"
bucket_name = "nessebar-lens-masters"

# Staging: a second, always-on Worker on its own hostname and its own D1, so a
# full purchase can be rehearsed with sandbox keys without touching production
# orders. Deploy with `--env staging` (opennextjs-cloudflare forwards it to
# wrangler) -- see DEVELOPMENT.md §Staging and .github/workflows/staging.yml.
#
# Wrangler does NOT inherit bindings into an environment, so every binding the
# code reads is redeclared here. Omit one and the staging Worker deploys green
# and answers 503 at runtime. ASSETS and [assets] are inherited (not bindings
# in the sense above); the compatibility settings and `main` are too.
#
# Secrets are not here either: the workflow ships them with --secrets-file.
[env.staging]
name = "nessebar-lens-staging"
routes = [{ pattern = "staging.nessebarlens.com", custom_domain = true }]

[[env.staging.d1_databases]]
binding = "ORDERS_DB"
database_name = "nessebar-lens-orders-staging"
database_id = "81efdc1d-087f-4b2c-981a-5902a4508fc6"
migrations_dir = "migrations"

# Both buckets are the PRODUCTION buckets, deliberately accepted for now (#202
# item 4, option a) so staging and PR previews render real photos and can sign
# print assets from real masters. Toll is near-zero only while these buckets are
# empty.
#
# "The code only reads them" is NOT an enforced control. R2 bindings have no
# read-only mode: an R2Bucket is full read+write+delete, and MastersBucket being
# `get()`-only is a TypeScript type the Worker runtime does not enforce. A
# preview runs unreviewed pull_request code, so it holds full access to
# production masters plus a print-asset signing capability. Code review of that
# code is the only thing standing between a PR and production masters.
#
# Before any real customer photos or a campaign land here, staging needs its own
# `nessebar-lens-masters-staging`, seeded from production masters so the
# full-purchase rehearsal stays visually representative. Placeholder-only
# staging is not an option: it breaks the rehearsal this environment exists for.
[[env.staging.r2_buckets]]
binding = "WEB"
bucket_name = "nessebar-lens-web"

[[env.staging.r2_buckets]]
binding = "MASTERS"
bucket_name = "nessebar-lens-masters"

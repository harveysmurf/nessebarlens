# Nessebar Lens — Cloudflare (OpenNext Worker + static assets)
# Secrets via `wrangler secret put` / CF dashboard — never git.
# R2 S3 access keys are unused; Workers use bucket bindings only.
# Do NOT set pages_build_output_dir — that makes Wrangler treat this as a
# Pages config where the ASSETS binding name is reserved.
# run_worker_first=true: Pages always invokes the worker first; OpenNext must
# fetch static files via env.ASSETS itself.
#
# `main` is the repo-root `worker.ts`, not OpenNext's generated
# `.open-next/worker.js`, because that file exports only `default { fetch }`
# plus the DO classes: a [triggers] crons entry would be accepted by wrangler
# and then silently never fire. `worker.ts` wraps the generated entry -- same
# `fetch`, same DO classes -- and adds the `scheduled` handler that drives the
# reconciler. `opennextjs-cloudflare` reads `main` here and never rewrites it,
# and `wrangler deploy` bundles whatever it names.
#
# The reconciler is a Next route (`src/app/api/internal/reconcile/route.ts`)
# either way. `worker.ts`'s `scheduled()` builds the same request
# `.github/workflows/reconcile.yml` used to make over HTTP -- same path, same
# method, same `x-reconcile-secret` header -- and calls it in-process, so there
# is one implementation with one auth check.
#
# Cloudflare Cron Triggers, not a GitHub schedule, because GitHub schedules are
# best-effort: reconcile.yml asked for every 15 minutes and GitHub actually ran
# it about 11 times in 42 hours (#201). A Cron Trigger is delivered by the
# platform running the code, so the bound cannot be dropped the same way.
name = "nessebar-lens"
main = "worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Declared per environment, not inherited: wrangler does not inherit top-level
# keys into [env.*], and a staging deploy that silently loses its cron is the
# exact bug #201 filed. `tests/workflow-hardening.test.mts` asserts both blocks.
crons = ["*/15 * * * *"]

[vars]
# Read by worker.ts's `scheduled()` to address the reconcile route in-process.
# NEXT_PUBLIC_* is normally inlined at build time and therefore not readable
# from the Worker env; this is a runtime var for the same name. Each environment
# overrides it with its own host (see below).
NEXT_PUBLIC_SITE_URL = "https://nessebarlens.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "nessebar-lens-orders"
database_id = "466035f5-fa14-4f0c-9d7a-2471025fe6f1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WEB"
bucket_name = "nessebar-lens-web"

[[r2_buckets]]
binding = "MASTERS"
bucket_name = "nessebar-lens-masters"

# Staging: a second, always-on Worker on its own hostname and its own D1, so a
# full purchase can be rehearsed with sandbox keys without touching production
# orders. Deploy with `--env staging` (opennextjs-cloudflare forwards it to
# wrangler) -- see DEVELOPMENT.md §Staging and .github/workflows/staging.yml.
#
# Wrangler does NOT inherit bindings into an environment, so every binding the
# code reads is redeclared here. Omit one and the staging Worker deploys green
# and answers 503 at runtime. ASSETS and [assets] are inherited (not bindings
# in the sense above); the compatibility settings and `main` are too.
#
# Secrets are not here either: the workflow ships them with --secrets-file.
[env.staging]
name = "nessebar-lens-staging"
routes = [{ pattern = "staging.nessebarlens.com", custom_domain = true }]
# Keep version previews on across deploys. `preview_urls` defaults to false, and
# `wrangler deploy` (which release.yml runs for staging on every main push)
# re-applies the worker's subdomain settings from this config. Without this key
# each staging deploy silently clears the account-side `previews_enabled` flag
# that preview.yml needs to read a `Version Preview URL`, so the PR preview job
# reds until somebody re-enables it by hand. See DEVELOPMENT.md §Staging previews.
preview_urls = true

# Repeated, not inherited (see the note on the top-level [triggers]). Staging
# having no reconciler at all is why the GitHub schedule's real behaviour could
# not be rehearsed before it reached production.
[env.staging.triggers]
crons = ["*/15 * * * *"]

[env.staging.vars]
NEXT_PUBLIC_SITE_URL = "https://staging.nessebarlens.com"

[[env.staging.d1_databases]]
binding = "ORDERS_DB"
database_name = "nessebar-lens-orders-staging"
database_id = "81efdc1d-087f-4b2c-981a-5902a4508fc6"
migrations_dir = "migrations"

# Both buckets are the PRODUCTION buckets, deliberately accepted for now (#202
# item 4, option a) so staging and PR previews render real photos and can sign
# print assets from real masters. Toll is near-zero only while these buckets are
# empty.
#
# "The code only reads them" is NOT an enforced control. R2 bindings have no
# read-only mode: an R2Bucket is full read+write+delete, and MastersBucket being
# `get()`-only is a TypeScript type the Worker runtime does not enforce. A
# preview runs unreviewed pull_request code, so it holds full access to
# production masters plus a print-asset signing capability. Code review of that
# code is the only thing standing between a PR and production masters.
#
# Before any real customer photos or a campaign land here, staging needs its own
# `nessebar-lens-masters-staging`, seeded from production masters so the
# full-purchase rehearsal stays visually representative. Placeholder-only
# staging is not an option: it breaks the rehearsal this environment exists for.
[[env.staging.r2_buckets]]
binding = "WEB"
bucket_name = "nessebar-lens-web"

[[env.staging.r2_buckets]]
binding = "MASTERS"
bucket_name = "nessebar-lens-masters"
